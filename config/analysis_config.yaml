# Statistical Analysis Configuration
# Disproportionality Analysis and Visualization Parameters

significance_level: 0.05
confidence_level: 0.95
minimum_case_threshold: 3
disproportionality_metrics:
  - "ROR"
  - "PRR"
  - "Chi-square"
ror_signal_threshold: "lower_ci_95 > 1.0"
prr_signal_threshold: "prr >= 2.0 and chi_square >= 4.0"
figure_dpi: 300
figure_format: "png"
rounding_decimals: 4
